name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - name: Update npm
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@12.2.1
      - run: npm ci --ignore-scripts
      - name: Verify release tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm test
      - run: npm run check
      - run: npm pack --ignore-scripts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --generate-notes
      - name: Publish npm artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'npm publication blocked: configure NPM_TOKEN for the authorized npm scope.'
            exit 1
          fi
          npm publish ./*.tgz --access public --ignore-scripts
